<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Django - Радіотерапія</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.svg' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #50E3C2;
            --background-color: #f4f7f6;
            --card-bg-color: #ffffff;
            --text-color: #333;
            --text-light-color: #777;
            --border-color: #e0e0e0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --input-bg: #ffffff;
            --table-header-bg: #f8f9fa;
            --hover-bg: #f8f9fa;
        }
        
        [data-theme="dark"] {
            --primary-color: #5BA0F2;
            --secondary-color: #60F3D2;
            --background-color: #1a1a2e;
            --card-bg-color: #16213e;
            --text-color: #e4e4e4;
            --text-light-color: #a0a0a0;
            --border-color: #2a2a4a;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            --input-bg: #1a1a2e;
            --table-header-bg: #1a1a2e;
            --hover-bg: #1f2b4a;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--card-bg-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .user-nav {
            display: flex;
            align-items: center;
        }
        
        .main-nav a, .user-nav a {
            text-decoration: none;
            color: var(--text-light-color);
            margin-right: 25px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .main-nav a:hover, .user-nav a:hover {
            color: var(--primary-color);
        }
        
        .user-nav a.btn {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
        }
        
        .btn-danger {
             background: #dc3545; 
        }
        
        .btn-danger:hover {
             background: #c82333; 
        }
        
        h1, h2 {
            color: var(--text-color);
            margin-bottom: 20px;
        }
        
        .card {
            background-color: var(--card-bg-color);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        /* Додаткові стилі для кнопок */
        .btn {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-block;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
        }
        
        .btn-secondary {
            background-color: #6c757d;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        /* Стилі для повідомлень */
        .messages {
            margin-bottom: 20px;
        }
        
        .message {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .message.warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        /* Стилі для полів введення дат */
        .datepicker-input {
            position: relative;
        }
        
        .datepicker-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }
        
        /* Custom Date Input Styles */
        .date-input-container {
            display: inline-flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 2px 8px;
            gap: 2px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .date-input-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }
        
        .date-part {
            border: none;
            background: transparent;
            text-align: center;
            font-size: 1rem;
            color: var(--text-color);
            padding: 8px 2px;
            outline: none;
        }
        
        .date-day, .date-month {
            width: 28px;
        }
        
        .date-year {
            width: 48px;
        }
        
        .date-separator {
            color: var(--text-light-color);
            font-weight: bold;
            user-select: none;
        }
        
        .date-part::placeholder {
            color: var(--text-light-color);
            opacity: 0.6;
        }
        
        /* Dark theme adjustments */
        [data-theme="dark"] .date-input-container {
            background-color: var(--input-bg);
            border-color: var(--border-color);
        }
        
        [data-theme="dark"] .date-part {
            color: var(--text-color);
        }
        
        [data-theme="dark"] .date-input-container:focus-within {
            box-shadow: 0 0 0 0.2rem rgba(91, 160, 242, 0.25);
        }

        /* Toast Component Styles */
        #toast-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            width: calc(100% - 50px);
            pointer-events: none;
        }

        .toast-popup {
            pointer-events: auto;
            background: var(--card-bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 14px 18px 18px 18px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            cursor: pointer;
            animation: toastSlideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .toast-popup:hover {
            transform: translateY(-2px);
        }

        .toast-popup.toast-closing {
            animation: toastSlideOut 0.25s ease forwards;
        }

        @keyframes toastSlideIn {
            from { opacity: 0; transform: translateY(-25px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastSlideOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-15px) scale(0.9); }
        }

        .toast-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
            animation: toastProgress linear forwards;
        }

        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }
        
        /* Theme Toggle Button */
        .theme-toggle {
            background: none;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light-color);
            transition: all 0.3s ease;
            margin-right: 15px;
        }
        
        .theme-toggle:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            transform: rotate(15deg);
        }
        
        .theme-toggle i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }
        
        [data-theme="dark"] .theme-toggle {
            background-color: var(--card-bg-color);
        }
        
        /* Smooth transition for theme change */
        body,
        header,
        .card,
        .btn,
        input,
        select,
        textarea,
        table,
        th,
        td {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        
        /* Dark theme specific adjustments */
        [data-theme="dark"] input,
        [data-theme="dark"] select,
        [data-theme="dark"] textarea {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        
        [data-theme="dark"] input::placeholder,
        [data-theme="dark"] textarea::placeholder {
            color: var(--text-light-color);
        }
        
        [data-theme="dark"] .form-control {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--border-color);
        }
        
        [data-theme="dark"] .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(90, 160, 242, 0.25);
        }
        
        [data-theme="dark"] table th {
            background-color: var(--table-header-bg);
        }
        
        [data-theme="dark"] table tbody tr:hover {
            background-color: var(--hover-bg);
        }
        
    </style>
</head>
<body>
    <header>
        <div class="logo">CMS</div>
        <nav class="main-nav">
            <a href="{% url 'dashboard' %}"><i class="fas fa-home"></i> Головна</a>
            <a href="{% url 'patient_create' %}"><i class="fas fa-plus"></i> Додати</a>
            <a href="{% url 'patient_list' %}" class="nav-link">Пацієнти</a>
            <a href="{% url 'inpatient_list' %}" class="nav-link">Стаціонар</a>
            <a href="/fractions/"><i class="fas fa-radiation"></i> Фракції</a>
        </nav>
        <nav class="user-nav">
            <button id="theme-toggle" class="theme-toggle" title="Перемкнути тему">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
            <a href="/admin/"><i class="fas fa-user-shield"></i> Адмін-панель</a>
            {% if user.is_staff %}
                <a href="{% url 'admin_users' %}" class="nav-link">Адмін</a>
            {% endif %}
            <a href="/logout/" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Вийти</a>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script>
        // Theme Toggle - завантажуємо тему до рендерингу сторінки
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Custom Date Input with auto-advance
            function initDateInputs() {
                const dateInputs = document.querySelectorAll('.datepicker-input');
                
                dateInputs.forEach(function(originalInput) {
                    // Створюємо контейнер для полів дати
                    const container = document.createElement('div');
                    container.className = 'date-input-container';
                    
                    // Створюємо три поля: день, місяць, рік
                    const dayInput = document.createElement('input');
                    dayInput.type = 'text';
                    dayInput.className = 'date-part date-day';
                    dayInput.placeholder = 'ДД';
                    dayInput.maxLength = 2;
                    dayInput.inputMode = 'numeric';
                    
                    const sep1 = document.createElement('span');
                    sep1.className = 'date-separator';
                    sep1.textContent = '.';
                    
                    const monthInput = document.createElement('input');
                    monthInput.type = 'text';
                    monthInput.className = 'date-part date-month';
                    monthInput.placeholder = 'ММ';
                    monthInput.maxLength = 2;
                    monthInput.inputMode = 'numeric';
                    
                    const sep2 = document.createElement('span');
                    sep2.className = 'date-separator';
                    sep2.textContent = '.';
                    
                    const yearInput = document.createElement('input');
                    yearInput.type = 'text';
                    yearInput.className = 'date-part date-year';
                    yearInput.placeholder = 'РРРР';
                    yearInput.maxLength = 4;
                    yearInput.inputMode = 'numeric';
                    
                    // Додаємо елементи в контейнер
                    container.appendChild(dayInput);
                    container.appendChild(sep1);
                    container.appendChild(monthInput);
                    container.appendChild(sep2);
                    container.appendChild(yearInput);
                    
                    // Ховаємо оригінальний input
                    originalInput.style.display = 'none';
                    originalInput.parentNode.insertBefore(container, originalInput.nextSibling);
                    
                    // Парсимо існуюче значення
                    if (originalInput.value) {
                        const parts = originalInput.value.split('.');
                        if (parts.length === 3) {
                            dayInput.value = parts[0];
                            monthInput.value = parts[1];
                            yearInput.value = parts[2];
                        }
                    }
                    
                    // Функція для оновлення оригінального поля
                    function updateOriginal() {
                        if (dayInput.value && monthInput.value && yearInput.value) {
                            const day = dayInput.value.padStart(2, '0');
                            const month = monthInput.value.padStart(2, '0');
                            const year = yearInput.value;
                            originalInput.value = `${day}.${month}.${year}`;
                        } else if (!dayInput.value && !monthInput.value && !yearInput.value) {
                            originalInput.value = '';
                        }
                    }
                    
                    // Обробка введення для дня
                    dayInput.addEventListener('input', function(e) {
                        this.value = this.value.replace(/\D/g, '');
                        
                        // Валідація дня (1-31)
                        if (this.value.length === 2) {
                            let day = parseInt(this.value, 10);
                            if (day > 31) this.value = '31';
                            if (day < 1 && this.value.length === 2) this.value = '01';
                            monthInput.focus();
                            monthInput.select();
                        }
                        updateOriginal();
                    });
                    
                    // Обробка введення для місяця
                    monthInput.addEventListener('input', function(e) {
                        this.value = this.value.replace(/\D/g, '');
                        
                        // Валідація місяця (1-12)
                        if (this.value.length === 2) {
                            let month = parseInt(this.value, 10);
                            if (month > 12) this.value = '12';
                            if (month < 1 && this.value.length === 2) this.value = '01';
                            yearInput.focus();
                            yearInput.select();
                        }
                        updateOriginal();
                    });
                    
                    // Обробка введення для року
                    yearInput.addEventListener('input', function(e) {
                        this.value = this.value.replace(/\D/g, '');
                        updateOriginal();
                    });
                    
                    // Автофокус на перше порожнє поле при кліку на контейнер
                    container.addEventListener('click', function(e) {
                        if (e.target === container) {
                            if (!dayInput.value) dayInput.focus();
                            else if (!monthInput.value) monthInput.focus();
                            else if (!yearInput.value) yearInput.focus();
                            else dayInput.focus();
                        }
                    });
                    
                    // Обробка Backspace для переходу назад
                    monthInput.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && this.value === '') {
                            dayInput.focus();
                            dayInput.select();
                        }
                    });
                    
                    yearInput.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && this.value === '') {
                            monthInput.focus();
                            monthInput.select();
                        }
                    });
                    
                    // Обробка стрілок ліво/право
                    dayInput.addEventListener('keydown', function(e) {
                        if (e.key === 'ArrowRight' && this.selectionStart === this.value.length) {
                            monthInput.focus();
                            monthInput.setSelectionRange(0, 0);
                        }
                    });
                    
                    monthInput.addEventListener('keydown', function(e) {
                        if (e.key === 'ArrowRight' && this.selectionStart === this.value.length) {
                            yearInput.focus();
                            yearInput.setSelectionRange(0, 0);
                        }
                        if (e.key === 'ArrowLeft' && this.selectionStart === 0) {
                            dayInput.focus();
                            dayInput.setSelectionRange(dayInput.value.length, dayInput.value.length);
                        }
                    });
                    
                    yearInput.addEventListener('keydown', function(e) {
                        if (e.key === 'ArrowLeft' && this.selectionStart === 0) {
                            monthInput.focus();
                            monthInput.setSelectionRange(monthInput.value.length, monthInput.value.length);
                        }
                    });
                    
                    // При фокусі виділяємо все
                    [dayInput, monthInput, yearInput].forEach(function(input) {
                        input.addEventListener('focus', function() {
                            setTimeout(() => this.select(), 0);
                        });
                    });
                });
            }
            
            initDateInputs();
            
            // Theme Toggle functionality
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            
            function updateThemeIcon() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                } else {
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                }
            }
            
            // Set initial icon state
            updateThemeIcon();
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                
                // Animate icon
                themeIcon.style.transform = 'rotate(360deg)';
                setTimeout(() => {
                    updateThemeIcon();
                    themeIcon.style.transform = 'rotate(0deg)';
                }, 150);
            });
        });

        // Global non-blocking Toast notification system
        window.showToast = function(message, type = 'info', duration = 3500) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast-popup toast-${type}`;

            let iconClass = 'fa-info-circle';
            let iconColor = '#3498db';
            let barColor = '#3498db';

            if (type === 'success') {
                iconClass = 'fa-check-circle';
                iconColor = '#2ecc71';
                barColor = '#2ecc71';
            } else if (type === 'error') {
                iconClass = 'fa-exclamation-triangle';
                iconColor = '#e74c3c';
                barColor = '#e74c3c';
            } else if (type === 'warning') {
                iconClass = 'fa-exclamation-circle';
                iconColor = '#f39c12';
                barColor = '#f39c12';
            }

            toast.innerHTML = `
                <i class="fas ${iconClass}" style="color: ${iconColor}; font-size: 1.3rem; margin-top: 2px; flex-shrink: 0;"></i>
                <div style="flex: 1; word-break: break-word;">${message}</div>
                <span style="font-size: 1.1rem; opacity: 0.5; margin-left: 8px; cursor: pointer; flex-shrink: 0; line-height: 1;" onclick="this.parentElement.remove()">&times;</span>
                <div class="toast-progress-bar" style="background-color: ${barColor}; animation-duration: ${duration}ms;"></div>
            `;

            toast.addEventListener('click', (e) => {
                if (!e.target.closest('a') && !e.target.closest('button')) {
                    removeToast(toast);
                }
            });

            container.appendChild(toast);

            const timer = setTimeout(() => {
                removeToast(toast);
            }, duration);

            function removeToast(el) {
                clearTimeout(timer);
                if (el.classList.contains('toast-closing')) return;
                el.classList.add('toast-closing');
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, 250);
            }
        };

        // Override native window.alert to make ALL alerts non-blocking toasts automatically
        window.alert = function(message) {
            if (!message) return;
            const strMsg = String(message);
            const isError = /помилка|error|fail|invalid|надайте|заповніть/i.test(strMsg);
            const isSuccess = /успішно|упішно|скопійовано|збережено|оновлено|видалено|завершено/i.test(strMsg);
            const type = isError ? 'error' : (isSuccess ? 'success' : 'info');
            window.showToast(strMsg, type, 3500);
        };
    </script>

    <!-- Global Toast Container -->
    <div id="toast-container"></div>
</body>
</html>
